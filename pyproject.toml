[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lforla-eval"
version = "0.1.0"
description = "CLI client for LFORLA — run benchmarks locally and push results to lforla.org"
authors = [
  { name = "LFORLA" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]
keywords = ["lforla", "llm", "benchmark", "evaluation", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://lforla.org/cli"
Repository = "https://github.com/lforla/pyforla"
Documentation = "https://lforla.org/cli"

[project.scripts]
lforla-eval = "lforla_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["lforla_eval"]
